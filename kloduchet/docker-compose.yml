services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skladuchet}
      POSTGRES_USER: ${POSTGRES_USER:-skladuchet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skladuchet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skladuchet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DB_ENGINE: postgres
      POSTGRES_HOST: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./backend:/workspace/kloduchet/backend
      - ./data:/workspace/kloduchet/data
      - ../Данные:/workspace/Данные
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DB_ENGINE: postgres
      POSTGRES_HOST: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./backend:/workspace/kloduchet/backend
      - ./data:/workspace/kloduchet/data
      - ../Данные:/workspace/Данные
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A config worker --loglevel=info

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
